name: "AgentRouter 自动签到"
description: "每日 09:00 自动登录 ps.air-outer.com 执行签到，查询余额与消耗；支持 Safari 登录时自动抓取凭据，或在脚本中手动填写账号。"
author: "773075692, MaYIHEI, adapted for Egern by EdwardRegal"
icon: https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/agentrouter/icon.png

scriptings:
  - http_request:
      name: "AgentRouter 凭据抓取"
      match: ^https?:\/\/ps\.air-outer\.com\/api\/user\/login
      script_url: https://raw.githubusercontent.com/EdwardRegal/egern-modules/main/agentrouter/agentrouter_cookie.js
      body_required: true

  - schedule:
      name: "AgentRouter 每日签到"
      cron: 0 0 9 * * *
      script_url: https://raw.githubusercontent.com/EdwardRegal/egern-modules/main/agentrouter/agentrouter_task.js
      timeout: 120

mitm:
  hostnames:
    includes:
      - ps.air-outer.com
