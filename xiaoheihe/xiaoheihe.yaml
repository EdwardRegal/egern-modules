name: "小黑盒日常签到与任务"
description: "小黑盒每日自动签到、做任务（分享/浏览榜单），以及自动抓取 Cookie 凭据。"
author: "cjy, modified for Egern"

scriptings:
  - http_request:
      name: "小黑盒凭据抓取"
      match: ^https?:\/\/(api|data)\.xiaoheihe\.cn\/.*heybox_id=
      script_url: https://raw.githubusercontent.com/EdwardRegal/egern-modules/main/xiaoheihe/heybox_cookie.js
      body_required: false

  - schedule:
      name: "小黑盒每日签到"
      cron: 0 3 9,21 * * *
      script_url: https://raw.githubusercontent.com/EdwardRegal/egern-modules/main/xiaoheihe/heybox_task.js
      timeout: 120

mitm:
  hostnames:
    includes:
      - api.xiaoheihe.cn
      - data.xiaoheihe.cn
