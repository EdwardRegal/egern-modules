name: "NodeSeek 每日签到"
description: "自动抓取 NodeSeek 登录 Cookie，每日 08:00 签到。"
author: "MaYIHEI"
icon: https://raw.githubusercontent.com/MaYIHEI/pin/refs/heads/main/app/nodeseek.png

scriptings:
  # 打开并登录 nodeseek.com 任意页面时抓取 Cookie
  - http_request:
      name: "NodeSeek Cookie 抓取"
      match: ^https:\/\/www\.nodeseek\.com\/
      script_url: https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/nodeseek/nodeseek.cookie.js
      body_required: false

  # 每日 08:00 自动签到
  - schedule:
      name: "NodeSeek 签到"
      cron: 0 0 8 * * *
      script_url: https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/nodeseek/nodeseek.js
      timeout: 60

mitm:
  hostnames:
    includes:
      - www.nodeseek.com
