name: "QQ音乐"
description: "QQ 音乐绿钻成长值、金币中心签到、App 每日任务与金币抽奖。自动抓取凭据，自动续期与领奖。"
author: "MaYIHEI"
icon: https://raw.githubusercontent.com/EdwardRegal/egern-modules/main/qqmusic/qqmusic.png

scriptings:
  # 1. 抓取 Cookie 凭据（打开 QQ 音乐进入「会员中心」或「金币中心」触发）
  - http_request:
      name: "QQ音乐 Cookie抓取"
      match: ^https?:\/\/u6\.y\.qq\.com\/cgi-bin\/musics\.fcg\?.*(EveryDaySignLvzScore|GetSignInSummary)
      script_url: https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/qqmusic/qqmusic.js
      body_required: true

  # 2. 定时任务 1：每日任务、绿钻与金币签到、抽奖（每天 07:30）
  - schedule:
      name: "QQ音乐每日任务"
      cron: 0 30 7 * * *
      script_url: https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/qqmusic/qqmusic.js
      timeout: 1200

  # 3. 定时任务 2：定时金币（9-10点每分钟唤醒检查，未到时间本地直接退出）
  - schedule:
      name: "QQ音乐定时金币"
      cron: 0 * 9-10 * * *
      script_url: https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/qqmusic/qqmusic.js
      timeout: 1200

  # 4. 定时任务 3：六个时段红包雨（0点、8点、12点、16点、20点、22点 的第 5 分钟）
  - schedule:
      name: "QQ音乐红包雨"
      cron: 0 5 0,8,12,16,20,22 * * *
      script_url: https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/qqmusic/qqmusic.js
      timeout: 1200

mitm:
  hostnames:
    includes:
      - u6.y.qq.com
