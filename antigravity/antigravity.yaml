name: "Antigravity 额度组件"
description: "监控 Antigravity (Google AI Pro) 账号的 Claude 与 Gemini 5小时额度与周额度。"
author: "EdwardRegal"
icon: https://raw.githubusercontent.com/EdwardRegal/egern-modules/main/antigravity/antigravity.png

scriptings:
  # 1. 桌面组件/应用面板 (Panel)：点击即时刷新展示
  - panel:
      name: "Antigravity 配额"
      title: "Antigravity Quota"
      content: "点击刷新配额数据"
      script_url: https://raw.githubusercontent.com/EdwardRegal/egern-modules/main/antigravity/antigravity_quota.js
      update_interval: 1800

  # 2. 定时通知任务 (Schedule)：每 2 小时推送一次
  - schedule:
      name: "Antigravity 额度检查"
      cron: 0 0 */2 * * *
      script_url: https://raw.githubusercontent.com/EdwardRegal/egern-modules/main/antigravity/antigravity_quota.js
      timeout: 60
